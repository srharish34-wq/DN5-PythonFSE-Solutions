<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Portal — JavaScript | Harish Seetharaman Rama</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #f4f6f9; color: #333; }
    header { background: #1a237e; color: #fff; padding: 16px 32px; display: flex; justify-content: space-between; align-items: center; }
    header h1 { font-size: 1.4rem; }
    #controls { display: flex; gap: 12px; padding: 24px 32px; justify-content: center; flex-wrap: wrap; }
    #search-courses { padding: 10px 16px; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem; width: 280px; }
    #sort-btn { padding: 10px 20px; background: #1a237e; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 1rem; }
    #sort-btn:hover { background: #283593; }
    #selected-course { display: none; margin: 0 32px 16px; padding: 12px 20px; background: #e8eaf6; border-left: 4px solid #1a237e; border-radius: 4px; color: #1a237e; font-weight: bold; }
    .course-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; padding: 0 32px 40px; max-width: 1200px; margin: 0 auto; }
    .course-card { background: #fff; padding: 20px; border: 1px solid #e0e0e0; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); cursor: pointer; transition: transform 0.2s; }
    .course-card:hover { transform: translateY(-4px); }
    .course-card:focus { outline: 3px solid #1a237e; }
    .course-card h3 { color: #1a237e; margin-bottom: 8px; }
    .course-card p  { color: #666; font-size: 0.9rem; margin-bottom: 10px; }
    .credits { background: #e8eaf6; color: #1a237e; padding: 3px 10px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; margin-right: 8px; }
    .grade   { background: #e8f5e9; color: #2e7d32; padding: 3px 10px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; }
    #total-credits { text-align: center; padding: 16px; font-size: 1.1rem; color: #1a237e; font-weight: bold; }
    footer { background: #1a237e; color: #fff; text-align: center; padding: 16px; }
  </style>
</head>
<body>
  <header>
    <h1>🎓 Student Portal</h1>
    <nav>
      <a href="#" style="color:#fff;margin:0 8px;">Home</a>
      <a href="#" style="color:#fff;margin:0 8px;">Courses</a>
    </nav>
  </header>

  <div id="controls">
    <input type="text" id="search-courses" placeholder="🔍 Search courses..." />
    <button id="sort-btn">Sort by Credits ↓</button>
  </div>

  <div id="selected-course"></div>
  <div class="course-grid"></div>
  <p id="total-credits"></p>

  <footer>
    <p>&copy; 2024 Student Portal — Cognizant DN5.0 | Harish Seetharaman Rama</p>
  </footer>

  <!-- ES6 module -->
  <script type="module" src="app.js"></script>
</body>
</html>
